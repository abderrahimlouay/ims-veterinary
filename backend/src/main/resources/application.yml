# Non-secret defaults only (development-workflow.md §7). Secrets come from the environment; see .env.example.
spring:
  application:
    name: ims
  profiles:
    default: dev
  datasource:
    url: ${IMS_DB_URL}
    username: ${IMS_DB_USERNAME}
    password: ${IMS_DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED # ADR-013
      # database-migration.md §9: strict SQL mode, UTC session (ADR-010)
      connection-init-sql: >-
        SET SESSION sql_mode = 'STRICT_TRANS_TABLES,ONLY_FULL_GROUP_BY,NO_ENGINE_SUBSTITUTION,ERROR_FOR_DIVISION_BY_ZERO',
        time_zone = '+00:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # ADR-018: schema only via Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # ADR-010
  flyway:
    locations: classpath:db/migration
  autoconfigure:
    # Users come from the database only: no generated in-memory user (its password would be logged).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  session:
    jdbc:
      initialize-schema: never # tables come from Flyway (V01_008, ADR-036)

server:
  servlet:
    session:
      timeout: 30m # ADR-036 idle timeout; cookie flags are set by SecurityConfiguration

management: # ADR-031: health and info only, no details
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs # ADR-031: JSON logs; the traceId MDC entry is included

ims:
  security:
    session:
      absolute-timeout: 10h # ADR-036
    password:
      min-length: 12 # ADR-039
  bootstrap: # ADR-040: first administrator, only when the users table is empty
    admin:
      username: ${IMS_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${IMS_BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${IMS_BOOTSTRAP_ADMIN_FULL_NAME:Administrator}
