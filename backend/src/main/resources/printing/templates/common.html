<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<style th:fragment="style">
  @page { size: A4; margin: 14mm 12mm 16mm 12mm;
    @bottom-center { content: "Page " counter(page) " / " counter(pages); font-family: 'Noto Sans'; font-size: 8pt; color: #555; } }
  body { font-family: 'Noto Sans', 'Noto Naskh Arabic'; font-size: 9pt; color: #111; }
  .header { width: 100%; border-collapse: collapse; }
  .header td { vertical-align: top; }
  .logo { max-height: 22mm; max-width: 45mm; }
  .company-name { font-size: 13pt; font-weight: 700; }
  .muted { color: #444; }
  .title { font-size: 15pt; font-weight: 700; text-align: right; }
  .right { text-align: right; }
  .boxes { width: 100%; margin-top: 6mm; border-collapse: separate; border-spacing: 0; }
  .box { border: 0.6pt solid #888; padding: 2.5mm 3mm; width: 50%; vertical-align: top; }
  table.lines { width: 100%; border-collapse: collapse; margin-top: 6mm; }
  table.lines th { background: #eee; border-bottom: 0.8pt solid #444; text-align: left; padding: 1.5mm; font-size: 8pt; }
  table.lines td { border-bottom: 0.4pt solid #bbb; padding: 1.5mm; vertical-align: top; }
  .num { text-align: right; white-space: nowrap; }
  .grand { font-weight: 700; font-size: 11pt; border-top: 0.8pt solid #444; }
  .footer { margin-top: 8mm; font-size: 8pt; color: #444; text-align: center; }
  .watermark { position: fixed; top: 100mm; left: 10mm; width: 190mm; text-align: center; font-size: 80pt;
    font-weight: 700; color: #f0c8c8; transform: rotate(-35deg); }
  .cancelled { margin-top: 3mm; color: #a00; font-weight: 700; }
</style>
</head>
<body>
<td th:fragment="company(company)" style="width: 60%">
  <th:block th:if="${company != null}">
    <img class="logo" th:if="${company.logo != null}" th:src="${company.logo}" alt=""/>
    <div class="company-name" th:text="${company.name}">Pharmacie</div>
    <div class="muted" th:each="line : ${company.lines}" th:text="${line}">Adresse</div>
  </th:block>
  <div class="muted" th:if="${company == null}">Identité de l'entreprise non renseignée</div>
</td>
</body>
</html>
