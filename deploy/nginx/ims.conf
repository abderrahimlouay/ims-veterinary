# Reference reverse proxy of the production server (ADR-150, ADR-152, ADR-157), for /etc/nginx/conf.d/.
# Replace ims.pharmacie.lan by the server's local name (the one in its certificate) and the paths if they differ.
# TLS: certificate signed by the pharmacy's private CA (ADR-152), its key readable by nginx only.

# Coarse limit per client address (security.md §11); login has its own throttling (ADR-038).
limit_req_zone $binary_remote_addr zone=ims_api:10m rate=20r/s;

server {
    listen 80;
    server_name ims.pharmacie.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ims.pharmacie.lan;

    ssl_certificate     /etc/ims/tls/server.crt;
    ssl_certificate_key /etc/ims/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ims_tls:5m;

    server_tokens off;
    # The largest request is the company logo (256 KB, ADR-140).
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API: the application on the loopback address only (ADR-151); it sends its own headers.
    location /api/ {
        limit_req zone=ims_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Run now waits for the backup (ADR-144); report PDFs of a long period take a while.
        proxy_read_timeout 300s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
    }

    # The built frontend (npm run build → /srv/ims/frontend): hashed assets cached, every route to index.html.
    root /srv/ims/frontend;

    location /assets/ {
        include /etc/nginx/snippets/ims-security-headers.conf;
        expires 1y;
    }

    location / {
        include /etc/nginx/snippets/ims-security-headers.conf;
        try_files $uri /index.html;
    }
}
