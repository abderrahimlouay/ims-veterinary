# CI pipeline (testing.md §10, ADR-032). Docker is available on GitHub-hosted runners, so the
# Testcontainers MySQL tests run here exactly as locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit, architecture, integration, migration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, typecheck, unit, build, e2e smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Full-history scan with the pinned CLI: gitleaks-action@v2 scans <first pushed commit>^..<last>,
      # which fails when the push contains the root commit.
      - run: docker run --rm -v "$PWD":/repo:ro ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --no-banner --redact -v
