# CI pipeline (testing.md §10, ADR-032). Docker is available on GitHub-hosted runners, so the
# Testcontainers MySQL tests run here exactly as locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit, architecture, integration, migration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright against the real backend and MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Starts the backend (spring-boot:test-run on a MySQL container) and the production build (playwright.config.ts).
      - run: npm run test:e2e
      # Traces and page snapshots of failed journeys, to see why without reproducing locally.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  dependencies:
    name: Dependency scan (OSV, ADR-155)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The resolved runtime dependencies with their exact versions: osv-scanner cannot resolve the versions the
      # Spring Boot parent manages from pom.xml alone.
      - run: ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DincludeTestScope=false -DoutputFormat=json -DoutputName=bom.cdx
        working-directory: backend
      - run: >-
          docker run --rm -v "$PWD":/repo:ro ghcr.io/google/osv-scanner:v2.2.4 scan source --format json
          -L /repo/backend/target/bom.cdx.json -L /repo/frontend/package-lock.json > osv.json || true
      - run: python3 .github/scripts/osv_gate.py osv.json .github/osv-allowlist.json

  proxy:
    name: Reverse proxy configuration (nginx -t, ADR-157)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A throw-away certificate only so that nginx can load the reference configuration.
      - run: |
          mkdir -p tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout tls/server.key -out tls/server.crt -days 1 -subj "/CN=ims.pharmacie.lan"
          chmod 644 tls/server.key
      - run: >-
          docker run --rm -v "$PWD/deploy/nginx/ims.conf":/etc/nginx/conf.d/default.conf:ro
          -v "$PWD/deploy/nginx/ims-security-headers.conf":/etc/nginx/snippets/ims-security-headers.conf:ro
          -v "$PWD/tls":/etc/ims/tls:ro nginx:1.28-alpine nginx -t

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Full-history scan with the pinned CLI: gitleaks-action@v2 scans <first pushed commit>^..<last>,
      # which fails when the push contains the root commit.
      - run: docker run --rm -v "$PWD":/repo:ro ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --no-banner --redact -v
