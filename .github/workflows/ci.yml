# CI pipeline (testing.md §10, ADR-032). Docker is available on GitHub-hosted runners, so the
# Testcontainers MySQL tests run here exactly as locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit, architecture, integration, migration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright against the real backend and MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ADR-159: Chrome and Edge; Edge runs the screen, header and accessibility journeys.
      - run: npx playwright install --with-deps chromium msedge
      # Starts the backend (spring-boot:test-run on a MySQL container) and the production build (playwright.config.ts).
      - run: npm run test:e2e
        env:
          E2E_EDGE: '1'
      # Traces and page snapshots of failed journeys, to see why without reproducing locally.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  dependencies:
    name: Dependency scan (OSV, ADR-155)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The resolved runtime dependencies with their exact versions: osv-scanner cannot resolve the versions the
      # Spring Boot parent manages from pom.xml alone.
      - run: ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DincludeTestScope=false -DoutputFormat=json -DoutputName=bom.cdx
        working-directory: backend
      - run: >-
          docker run --rm -v "$PWD":/repo:ro ghcr.io/google/osv-scanner:v2.2.4 scan source --format json
          -L /repo/backend/target/bom.cdx.json -L /repo/frontend/package-lock.json > osv.json || true
      - run: python3 .github/scripts/osv_gate.py osv.json .github/osv-allowlist.json

  release:
    name: Release JAR with the screens inside (ADR-166)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci && npm run build
        working-directory: frontend
      - run: ./mvnw -B -Prelease -DskipTests package
        working-directory: backend
      # The application serves the screens itself: the JAR must hold the built index, its assets and the headers file.
      - run: |
          unzip -l backend/target/ims-*.jar > jar.txt
          grep -q 'BOOT-INF/classes/static/index.html' jar.txt
          grep -q 'BOOT-INF/classes/static/assets/' jar.txt
          grep -q 'BOOT-INF/classes/frontend/securityHeaders.json' jar.txt

  windows-scripts:
    name: Windows scripts (PowerShell syntax, ADR-165)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The owner's laptop runs these (deploy/windows); a syntax error must never reach an installation or an update.
      - shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem deploy/windows -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $tokens, [ref] $errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
            # Windows PowerShell 5.1 reads a script without a BOM as ANSI: the French messages would come out garbled.
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Host "::error file=$($file.Name)::Save it as UTF-8 with BOM (Windows PowerShell 5.1)"; $failed = $true
            }
          }
          if ($failed) { exit 1 }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Full-history scan with the pinned CLI: gitleaks-action@v2 scans <first pushed commit>^..<last>,
      # which fails when the push contains the root commit.
      - run: docker run --rm -v "$PWD":/repo:ro ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --no-banner --redact -v
